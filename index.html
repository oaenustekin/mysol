<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mysol</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: black;
            color: white;
            font-family: 'arial', sans-serif;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="w-full h-screen snap-y snap-mandatory overflow-y-auto">
        <div class="w-full h-screen flex flex-col justify-between items-center snap-start snap-always">
            <div class="h-16">
            </div>
            <div>
                <p class="text-xl text-gray-300">Geçen Süre:</p>
                <div id="time1">
                    <p id="time1-value" class="text-2xl font-bold text-gray-300">00 gün 00 saat</p>
                </div>
            </div>
            <div class="h-16">
                <a href="encryption.html">Şifreli Mesaj</a>
            </div>
        </div>
    </div>
    <script>
        function formatElapsed(start) {
            const now = new Date();
            const diffInMs = now - start;
            const totalSeconds = Math.floor(diffInMs / 1000);
            const days = Math.floor(totalSeconds / (60 * 60 * 24));
            const hours = Math.floor((totalSeconds % (60 * 60 * 24)) / 3600);
            return `${days} gün ${String(hours).padStart(2, '0')} saat`;
        }
        function updateElapsedTimes() {
            const start1 = new Date("2025-05-21T00:00:00");
            document.getElementById("time1-value").textContent = formatElapsed(start1);
        }
        setInterval(updateElapsedTimes, 1000);
        updateElapsedTimes();
    </script>
</body>
</html>
